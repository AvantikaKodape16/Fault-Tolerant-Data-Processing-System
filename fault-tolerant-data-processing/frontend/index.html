<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Processing System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 { color: white; margin-bottom: 30px; text-align: center; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card h2 { color: #333; margin-bottom: 15px; font-size: 18px; }
        textarea, input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
        textarea { min-height: 150px; resize: vertical; }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        button:hover { background: #764ba2; }
        button.secondary {
            background: #48bb78;
            margin-left: 10px;
        }
        button.secondary:hover { background: #38a169; }
        .status-message {
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 12px;
        }
        .status-success { background: #c6f6d5; color: #22543d; }
        .status-error { background: #fed7d7; color: #742a2a; }
        .status-info { background: #bee3f8; color: #2c5282; }
        .results { background: #f7fafc; padding: 15px; border-radius: 4px; margin-top: 10px; }
        .results pre { overflow-x: auto; font-size: 11px; }
        label {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
            margin-bottom: 0;
        }
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Fault-Tolerant Data Processing</h1>
        
        <div class="grid">
            <!-- Event Submission -->
            <div class="card">
                <h2>📤 Submit Event</h2>
                <select id="clientSelect">
                    <option value="client_A">Client A</option>
                    <option value="client_B">Client B</option>
                    <option value="client_C">Client C (Unknown)</option>
                </select>
                
                <textarea id="eventPayload" placeholder="Enter event payload JSON...">{"metric": "sales", "amount": "1200", "timestamp": "2024/01/01"}</textarea>
                
                <label>
                    <input type="checkbox" id="simulateFailure">
                    Simulate DB failure (will be rejected)
                </label>
                
                <button onclick="submitEvent()">Submit Event</button>
                <button class="secondary" onclick="submitDuplicate()">Submit Duplicate</button>
                
                <div id="submitMessage"></div>
            </div>

            <!-- Aggregated Results -->
            <div class="card">
                <h2>📊 Aggregated Results</h2>
                
                <input type="text" id="filterClient" placeholder="Filter by client (optional)">
                <input type="text" id="filterMetric" placeholder="Filter by metric (optional)">
                <input type="number" id="filterDays" value="30" placeholder="Days">
                
                <button onclick="getAggregates()">Load Aggregates</button>
                
                <div id="aggregateResults" class="results" style="display:none;">
                    <pre id="aggregateJson"></pre>
                </div>
            </div>
        </div>

        <!-- Event Status -->
        <div class="card">
            <h2>📋 Event Status</h2>
            <button onclick="getEventStatus()">Refresh Status</button>
            <button class="secondary" onclick="getProcessedEvents()">View Processed</button>
            <button class="secondary" onclick="getFailedEvents()">View Failed</button>
            <div id="statusResults" class="results" style="display:none;">
                <pre id="statusJson"></pre>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
